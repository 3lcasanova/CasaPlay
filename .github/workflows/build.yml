# CasaPlay · Designed by 𝐂𝓪sΔηⓞשα
# Builds the iOS/iPadOS and tvOS apps for the simulator and runs the CasaPlayKit tests.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test CasaPlayKit
        working-directory: Packages/CasaPlayKit
        run: swift test
      - name: Live AVFoundation probe test (macOS)
        working-directory: Packages/CasaPlayKit
        # Requires a real network connection. Set CASAPLAY_LIVE_EXTENSIONS=1 in repo settings
        # (Actions → Secrets and variables → Variables) to enable. Off by default.
        if: ${{ env.CASAPLAY_LIVE_EXTENSIONS == '1' }}
        env:
          CASAPLAY_LIVE_EXTENSIONS: ${{ vars.CASAPLAY_LIVE_EXTENSIONS }}
        run: swift test --filter LiveExtensionTests.testAVFoundationReadsRealFile

  app:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CasaPlay-iOS
            scheme: CasaPlay-iOS
            destination: generic/platform=iOS Simulator
            spec: project.yml
          - name: CasaPlay-tvOS
            scheme: CasaPlay-tvOS
            destination: generic/platform=tvOS Simulator
            spec: project.yml
          # The Apple TV Top Shelf extension, built into the tvOS app. Unsigned, so it needs no App ID.
          - name: CasaPlay-tvOS-TopShelf
            scheme: CasaPlay-tvOS
            destination: generic/platform=tvOS Simulator
            spec: project-topshelf.yml
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ${{ matrix.spec }}
      - name: Upload generated Xcode project
        if: matrix.scheme == 'CasaPlay-iOS'
        uses: actions/upload-artifact@v4
        with:
          name: CasaPlay-xcodeproj
          path: CasaPlay.xcodeproj
      - name: Build ${{ matrix.name }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project CasaPlay.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
