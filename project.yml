# CasaPlay · Designed by 𝐂𝓪sΔηⓞשα
#
# XcodeGen spec. Run `xcodegen generate` in this folder to create CasaPlay.xcodeproj.
# One shared SwiftUI codebase (App/Shared) builds for iPhone, iPad and Apple TV.
# All logic that is not UI lives in the Swift package Packages/CasaPlayKit.

name: CasaPlay

options:
  bundleIdPrefix: com.casanova
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    # 18.0 is what the Aether engine (7.x) needs; every iPhone, iPad and Apple TV that runs
    # iOS / tvOS 26 is well above it.
    iOS: "18.0"
    tvOS: "18.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Apple developer team used to sign for real devices.
    DEVELOPMENT_TEAM: 25G5V76853

packages:
  CasaPlayKit:
    path: Packages/CasaPlayKit
  # AetherEngine 7.x (LGPL-3.0 with an App Store exception). Plays MKV with real HDR10 and Dolby Vision
  # on the TV, decoding on the Apple hardware (VideoToolbox). Pinned to one release so a build never
  # changes by itself. 7.x needs iOS and tvOS 18 and Xcode 16.3 or newer; the public API CasaPlay uses
  # is the same as in 6.89.1, the last release for iOS / tvOS 17. Not 7.67.0 or later: their benchmark file
  # Diagnostics/PerFrameBenchmark.swift (line 261) makes Xcode 26.5 stop with "unable to type-check this
  # expression in reasonable time". 7.66.1 is the last release without it.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.66.1

targets:
  CasaPlay-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
      - package: AetherEngine
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        # Same ID as the tvOS app: it is already registered, and a free Apple account can only
        # create 10 new App IDs per 7 days.
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.CasaPlay
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Live TV channels are often served over plain HTTP. This lets the video player open
          # them; everything else (add-ons, API calls, pictures) still has to use HTTPS.
          NSAllowsArbitraryLoadsForMedia: true
        TMDBAPIKey: $(TMDB_API_KEY)
        TVDBAPIKey: $(TVDB_API_KEY)
        OMDbAPIKey: $(OMDB_API_KEY)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)
        PersonalAddonURL: $(PERSONAL_ADDON_URL)
        PersonalXtreamServer: $(XTREAM_SERVER)
        PersonalXtreamUsername: $(XTREAM_USERNAME)
        PersonalXtreamPassword: $(XTREAM_PASSWORD)

  CasaPlay-tvOS:
    type: application
    platform: tvOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
      - package: AetherEngine
      # The Top Shelf extension is not listed here on purpose. It needs its own new App ID, and a
      # free Apple account can only create 10 per 7 days. See project-topshelf.yml.
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        # Reuses an App ID that is already registered for this team. Free teams can only
        # create 10 new App IDs per 7 days, which blocked com.casanova.casaplay.
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.CasaPlay
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: Config/tvOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UIUserInterfaceStyle: Dark
        # casaplay://title/movie/603 opens that title. Top Shelf uses it.
        CFBundleURLTypes:
          - CFBundleURLName: com.casanova.CasaPlay
            CFBundleURLSchemes:
              - casaplay
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Live TV channels are often served over plain HTTP. This lets the video player open
          # them; everything else (add-ons, API calls, pictures) still has to use HTTPS.
          NSAllowsArbitraryLoadsForMedia: true
        TMDBAPIKey: $(TMDB_API_KEY)
        TVDBAPIKey: $(TVDB_API_KEY)
        OMDbAPIKey: $(OMDB_API_KEY)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)
        PersonalAddonURL: $(PERSONAL_ADDON_URL)
        PersonalXtreamServer: $(XTREAM_SERVER)
        PersonalXtreamUsername: $(XTREAM_USERNAME)
        PersonalXtreamPassword: $(XTREAM_PASSWORD)

  # Apple TV Top Shelf: when CasaPlay is in the top row of the Home Screen, this shows what is
  # trending right now above the app row. It has its own App ID (the app's ID plus ".TopShelf"),
  # which Xcode registers by itself on the first build. No App Group is used.
  # It is only built into the app when you generate with project-topshelf.yml, because a free
  # Apple account may be out of new App IDs (10 per 7 days) and then no build can be signed.
  CasaPlay-TopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - App/TopShelf
    settings:
      base:
        PRODUCT_NAME: CasaPlayTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.CasaPlay.TopShelf
    info:
      path: Config/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        TMDBAPIKey: $(TMDB_API_KEY)
