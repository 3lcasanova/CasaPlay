# CasaPlay · Designed by 𝐂𝓪sΔηⓞשα
#
# XcodeGen spec. Run `xcodegen generate` in this folder to create CasaPlay.xcodeproj.
# One shared SwiftUI codebase (App/Shared) builds for iPhone, iPad and Apple TV.
# All logic that is not UI lives in the Swift package Packages/CasaPlayKit.

name: CasaPlay

options:
  bundleIdPrefix: com.casanova
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Add your Apple developer team to run on a real device:
    # DEVELOPMENT_TEAM: ABCDE12345

packages:
  CasaPlayKit:
    path: Packages/CasaPlayKit

targets:
  CasaPlay-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.casaplay
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  CasaPlay-tvOS:
    type: application
    platform: tvOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.casaplay
    info:
      path: Config/tvOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
