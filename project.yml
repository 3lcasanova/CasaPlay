# CasaPlay · Designed by 𝐂𝓪sΔηⓞשα
#
# XcodeGen spec. Run `xcodegen generate` in this folder to create CasaPlay.xcodeproj.
# One shared SwiftUI codebase (App/Shared) builds for iPhone, iPad and Apple TV.
# All logic that is not UI lives in the Swift package Packages/CasaPlayKit.

name: CasaPlay

options:
  bundleIdPrefix: com.casanova
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Apple developer team used to sign for real devices.
    DEVELOPMENT_TEAM: 25G5V76853

packages:
  CasaPlayKit:
    path: Packages/CasaPlayKit
  # VLCKit 3.6 (LGPL-2.1) as a Swift package. Plays MKV and other files Apple's player can't.
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0

targets:
  CasaPlay-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        # Same ID as the tvOS app: it is already registered, and a free Apple account can only
        # create 10 new App IDs per 7 days.
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.CasaPlay
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Live TV channels are often served over plain HTTP. This lets the video player open
          # them; everything else (add-ons, API calls, pictures) still has to use HTTPS.
          NSAllowsArbitraryLoadsForMedia: true
        TMDBAPIKey: $(TMDB_API_KEY)
        TVDBAPIKey: $(TVDB_API_KEY)
        OMDbAPIKey: $(OMDB_API_KEY)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)

  CasaPlay-tvOS:
    type: application
    platform: tvOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: CasaPlayKit
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_NAME: CasaPlay
        # Reuses an App ID that is already registered for this team. Free teams can only
        # create 10 new App IDs per 7 days, which blocked com.casanova.casaplay.
        PRODUCT_BUNDLE_IDENTIFIER: com.casanova.CasaPlay
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: Config/tvOS/Info.plist
      properties:
        CFBundleDisplayName: CasaPlay
        NSHumanReadableCopyright: "Designed by 𝐂𝓪sΔηⓞשα"
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: CasaPlay looks for your Mac, NAS or media server on your home network to play your movies and shows.
        NSBonjourServices:
          - _smb._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Live TV channels are often served over plain HTTP. This lets the video player open
          # them; everything else (add-ons, API calls, pictures) still has to use HTTPS.
          NSAllowsArbitraryLoadsForMedia: true
        TMDBAPIKey: $(TMDB_API_KEY)
        TVDBAPIKey: $(TVDB_API_KEY)
        OMDbAPIKey: $(OMDB_API_KEY)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)
